name: SoulbrandtIOS
options:
  bundleIdPrefix: com.izeldinlkh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Manual
targets:
  SoulbrandtIOS:
    type: application
    platform: iOS
    sources:
      - path: SoulbrandtIOS
      - path: ThirdParty/libudfread/src/udfread.c
      - path: ThirdParty/libudfread/src/ecma167.c
      - path: ThirdParty/libudfread/src/default_blockinput.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.izeldinlkh.soulbrandt-ios
        PRODUCT_NAME: Soulbrandt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Soulbrandt
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: SoulbrandtIOS/Soulbrandt-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/ThirdParty/libudfread/src
          - $(SRCROOT)/build/ps3recomp-runtime/include
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build/ps3recomp-runtime
        OTHER_LDFLAGS:
          - $(inherited)
          - -lps3recomp_runtime
          - -lc++
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - HAVE_UNISTD_H=1
          - HAVE_FCNTL_H=1
          - HAVE_PTHREAD_H=1
          - SOULBRANDT_LINKED_RENDER_RUNTIME=1
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Foundation.framework
    scheme:
      testTargets: []
