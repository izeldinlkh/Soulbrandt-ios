name: iOS shell build

on:
  push:
    branches: [ios-port-work]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

# A push for every small commit was leaving a long queue of obsolete macOS
# builds. Keep only the newest build for this branch/ref.
concurrency:
  group: ios-shell-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the portable parser test on Linux as an independent scheduling and
  # correctness signal while the native iOS build waits for Apple's Xcode runner.
  iso-reader-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run ISO reader smoke test
        run: bash ios/scripts/run-iso-smoke-test.sh
      - name: Run UDF reader smoke test
        run: bash ios/scripts/run-udf-smoke-test.sh
      - name: Run PS3 controller mapping smoke test
        run: bash ios/scripts/run-pad-mapper-smoke-test.sh
      - name: Run PS3 pad C bridge smoke test
        run: bash ios/scripts/run-pad-bridge-smoke-test.sh
      - name: Run PS3 audio C bridge smoke test
        run: bash ios/scripts/run-audio-bridge-smoke-test.sh

  build-ios-shell:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify runner Xcode
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Validate pinned ps3recomp iOS Metal adaptation
        run: |
          PIN="$(sed -n 's/^commit=//p' ps3recomp.pin)"
          REPO="$(sed -n 's/^repo=//p' ps3recomp.pin)"
          test -n "$PIN" && test -n "$REPO"
          mkdir "$RUNNER_TEMP/ps3recomp"
          git -C "$RUNNER_TEMP/ps3recomp" init
          git -C "$RUNNER_TEMP/ps3recomp" remote add origin "$REPO"
          git -C "$RUNNER_TEMP/ps3recomp" fetch --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/ps3recomp" checkout --detach FETCH_HEAD
          python3 ios/scripts/patch-ps3recomp-ios-metal.py "$RUNNER_TEMP/ps3recomp"
          # The patch must be repeatable; a second run is a no-op.
          python3 ios/scripts/patch-ps3recomp-ios-metal.py "$RUNNER_TEMP/ps3recomp"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          PS3="$RUNNER_TEMP/ps3recomp"
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/video" -I"$PS3/runtime/spu" \
            "$PS3/libs/video/rsx_metal_backend.m"
          xcrun --sdk iphoneos clang++ -fsyntax-only -std=c++20 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/video" \
            "$PS3/libs/video/rsx_shader_msl.cpp"
          xcrun --sdk iphoneos clang -fsyntax-only -std=c17 \
            -DPS3RECOMP_PAD_IOS_NATIVE=1 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/input" -I"$PS3/runtime" \
            -I"$PS3/runtime/ppu" -I"$PS3/runtime/platform" \
            "$PS3/libs/input/cellPad.c"
          xcrun --sdk iphoneos clang -fsyntax-only -std=c17 \
            -DPS3RECOMP_AUDIO_IOS_NATIVE=1 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/audio" -I"$PS3/runtime" \
            -I"$PS3/runtime/ppu" -I"$PS3/runtime/memory" \
            -I"$PS3/runtime/syscalls" \
            "$PS3/libs/audio/cellAudio.c"
      - name: Build the pinned PS3 runtime for iOS arm64
        run: |
          cmake -S "$RUNNER_TEMP/ps3recomp" -B "$RUNNER_TEMP/ps3recomp-ios-build" \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS3RECOMP_BUILD_TESTS=OFF \
            -DPS3RECOMP_RSX_HAL=OFF
          cmake --build "$RUNNER_TEMP/ps3recomp-ios-build" \
            --target ps3recomp_runtime --parallel 3
          mkdir -p ios/build/ps3recomp-runtime
          cp "$RUNNER_TEMP/ps3recomp-ios-build/libps3recomp_runtime.a" \
            ios/build/ps3recomp-runtime/
      - name: Install XcodeGen and CMake tools
        run: brew install xcodegen cmake ninja
      - name: Build patched ps3recomp runtime for iOS
        run: |
          PS3="$RUNNER_TEMP/ps3recomp"
          BUILD="$RUNNER_TEMP/ps3recomp-ios-build"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S "$PS3" -B "$BUILD" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER="$(xcrun -f clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun -f clang++)" \
            -DCMAKE_OBJC_COMPILER="$(xcrun -f clang)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS3RECOMP_BUILD_TESTS=OFF \
            -DPS3RECOMP_RSX_HAL=OFF \
            -DPS3RECOMP_FFMPEG_RUNTIME=OFF
          cmake --build "$BUILD" --target ps3recomp_runtime --parallel 2
          find "$BUILD" -name 'libps3recomp_runtime.a' -type f -size +0c -print -quit | grep -q .
      - name: Run ISO reader smoke test
        run: bash ios/scripts/run-iso-smoke-test.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned iOS app
        working-directory: ios
        run: >-
          xcodebuild
          -project SoulbrandtIOS.xcodeproj
          -scheme SoulbrandtIOS
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -configuration Debug
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/Soulbrandt.app build/Payload/
          cp ThirdParty/libudfread/COPYING build/Payload/Soulbrandt.app/COPYING
          test -s build/Payload/Soulbrandt.app/COPYING
          cd build
          /usr/bin/zip -qry Soulbrandt-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Soulbrandt-PS3Recomp-iOS-runtime
          path: ios/build/ps3recomp-runtime/libps3recomp_runtime.a
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Soulbrandt-unsigned-IPA
          path: ios/build/Soulbrandt-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
