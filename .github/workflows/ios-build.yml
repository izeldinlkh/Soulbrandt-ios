name: iOS shell build

on:
  push:
    branches: [ios-port-work]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

# A push for every small commit was leaving a long queue of obsolete macOS
# builds. Keep only the newest build for this branch/ref.
concurrency:
  group: ios-shell-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the portable parser test on Linux as an independent scheduling and
  # correctness signal while the native iOS build waits for Apple's Xcode runner.
  iso-reader-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ISO reader smoke test
        run: bash ios/scripts/run-iso-smoke-test.sh

  build-ios-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run ISO reader smoke test
        run: bash ios/scripts/run-iso-smoke-test.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned iOS app
        working-directory: ios
        run: >-
          xcodebuild
          -project SoulbrandtIOS.xcodeproj
          -scheme SoulbrandtIOS
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -configuration Debug
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/Soulbrandt.app build/Payload/
          cd build
          /usr/bin/zip -qry Soulbrandt-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Soulbrandt-unsigned-IPA
          path: ios/build/Soulbrandt-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
