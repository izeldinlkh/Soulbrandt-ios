name: iOS shell build

on:
  push:
    branches: [ios-port-work]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build-ios-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run ISO reader smoke test
        run: bash ios/scripts/run-iso-smoke-test.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned iOS app
        working-directory: ios
        run: >-
          xcodebuild
          -project SoulbrandtIOS.xcodeproj
          -scheme SoulbrandtIOS
          -sdk iphoneos
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
