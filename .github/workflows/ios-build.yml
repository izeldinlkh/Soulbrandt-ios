name: iOS shell build

on:
  push:
    branches: [ios-port-work]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

# A push for every small commit was leaving a long queue of obsolete macOS
# builds. Keep only the newest build for this branch/ref.
concurrency:
  group: ios-shell-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the portable parser test on Linux as an independent scheduling and
  # correctness signal while the native iOS build waits for Apple's Xcode runner.
  iso-reader-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run ISO reader smoke test
        run: bash ios/scripts/run-iso-smoke-test.sh
      - name: Run UDF reader smoke test
        run: bash ios/scripts/run-udf-smoke-test.sh
      - name: Run PS3 controller mapping smoke test
        run: bash ios/scripts/run-pad-mapper-smoke-test.sh
      - name: Run PS3 pad C bridge smoke test
        run: bash ios/scripts/run-pad-bridge-smoke-test.sh

  build-ios-shell:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify runner Xcode
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Validate pinned ps3recomp iOS Metal adaptation
        run: |
          PIN="$(sed -n 's/^commit=//p' ps3recomp.pin)"
          REPO="$(sed -n 's/^repo=//p' ps3recomp.pin)"
          test -n "$PIN" && test -n "$REPO"
          mkdir "$RUNNER_TEMP/ps3recomp"
          git -C "$RUNNER_TEMP/ps3recomp" init
          git -C "$RUNNER_TEMP/ps3recomp" remote add origin "$REPO"
          git -C "$RUNNER_TEMP/ps3recomp" fetch --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/ps3recomp" checkout --detach FETCH_HEAD
          python3 ios/scripts/patch-ps3recomp-ios-metal.py "$RUNNER_TEMP/ps3recomp"
          # The patch must be repeatable; a second run is a no-op.
          python3 ios/scripts/patch-ps3recomp-ios-metal.py "$RUNNER_TEMP/ps3recomp"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          PS3="$RUNNER_TEMP/ps3recomp"
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/video" -I"$PS3/runtime/spu" \
            "$PS3/libs/video/rsx_metal_backend.m"
          xcrun --sdk iphoneos clang++ -fsyntax-only -std=c++20 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/video" \
            "$PS3/libs/video/rsx_shader_msl.cpp"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run ISO reader smoke test
        run: bash ios/scripts/run-iso-smoke-test.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned iOS app
        working-directory: ios
        run: >-
          xcodebuild
          -project SoulbrandtIOS.xcodeproj
          -scheme SoulbrandtIOS
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -configuration Debug
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/Soulbrandt.app build/Payload/
          cp ThirdParty/libudfread/COPYING build/Payload/Soulbrandt.app/COPYING
          test -s build/Payload/Soulbrandt.app/COPYING
          cd build
          /usr/bin/zip -qry Soulbrandt-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Soulbrandt-unsigned-IPA
          path: ios/build/Soulbrandt-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
