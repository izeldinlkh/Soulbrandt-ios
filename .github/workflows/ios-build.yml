name: iOS shell build

on:
  push:
    branches: [ios-port-work]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

# A push for every small commit was leaving a long queue of obsolete macOS
# builds. Keep only the newest build for this branch/ref.
concurrency:
  group: ios-shell-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the portable parser test on Linux as an independent scheduling and
  # correctness signal while the native iOS build waits for Apple's Xcode runner.
  iso-reader-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run ISO reader smoke test
        run: bash ios/scripts/run-iso-smoke-test.sh
      - name: Run extracted game folder reader smoke test
        run: bash ios/scripts/run-extracted-folder-smoke-test.sh
      - name: Run EBOOT extraction smoke test
        run: bash ios/scripts/run-boot-image-store-smoke-test.sh
      - name: Run virtual disc VFS smoke test
        run: bash ios/scripts/run-disc-vfs-smoke-test.sh
      - name: Run RSX frame pump smoke test
        run: bash ios/scripts/run-rsx-frame-pump-smoke-test.sh
      - name: Run UDF reader smoke test
        run: bash ios/scripts/run-udf-smoke-test.sh
      - name: Run PS3 controller mapping smoke test
        run: bash ios/scripts/run-pad-mapper-smoke-test.sh
      - name: Run PS3 pad C bridge smoke test
        run: bash ios/scripts/run-pad-bridge-smoke-test.sh
      - name: Run PS3 audio C bridge smoke test
        run: bash ios/scripts/run-audio-bridge-smoke-test.sh
      - name: Run PS3 runtime bridge lifecycle smoke test
        run: bash ios/scripts/run-runtime-bridge-smoke-test.sh
      - name: Run PS3 guest memory reservation smoke test
        run: bash ios/scripts/run-guest-memory-smoke-test.sh
      - name: Run PPU host bridge lifecycle smoke test
        run: bash ios/scripts/run-ppu-host-bridge-smoke-test.sh
      - name: Run PPU host boot-dispatch smoke test
        run: bash ios/scripts/run-ppu-host-boot-dispatch-smoke-test.sh

  build-ios-shell:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify runner Xcode
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Validate pinned ps3recomp iOS Metal adaptation
        run: |
          PIN="$(sed -n 's/^commit=//p' ps3recomp.pin)"
          REPO="$(sed -n 's/^repo=//p' ps3recomp.pin)"
          test -n "$PIN" && test -n "$REPO"
          mkdir "$RUNNER_TEMP/ps3recomp"
          git -C "$RUNNER_TEMP/ps3recomp" init
          git -C "$RUNNER_TEMP/ps3recomp" remote add origin "$REPO"
          git -C "$RUNNER_TEMP/ps3recomp" fetch --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/ps3recomp" checkout --detach FETCH_HEAD
          python3 ios/scripts/patch-ps3recomp-ios-metal.py "$RUNNER_TEMP/ps3recomp"
          # The patch must be repeatable; a second run is a no-op.
          python3 ios/scripts/patch-ps3recomp-ios-metal.py "$RUNNER_TEMP/ps3recomp"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          PS3="$RUNNER_TEMP/ps3recomp"
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/video" -I"$PS3/runtime/spu" \
            "$PS3/libs/video/rsx_metal_backend.m"
          xcrun --sdk iphoneos clang++ -fsyntax-only -std=c++20 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/video" \
            "$PS3/libs/video/rsx_shader_msl.cpp"
          xcrun --sdk iphoneos clang -fsyntax-only -std=c17 \
            -DPS3RECOMP_PAD_IOS_NATIVE=1 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/input" -I"$PS3/runtime" \
            -I"$PS3/runtime/ppu" -I"$PS3/runtime/platform" \
            "$PS3/libs/input/cellPad.c"
          xcrun --sdk iphoneos clang -fsyntax-only -std=c17 \
            -DPS3RECOMP_AUDIO_IOS_NATIVE=1 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/audio" -I"$PS3/runtime" \
            -I"$PS3/runtime/ppu" -I"$PS3/runtime/memory" \
            -I"$PS3/runtime/syscalls" \
            "$PS3/libs/audio/cellAudio.c"
          xcrun --sdk iphoneos clang -fsyntax-only -std=c17 \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -I"$PS3/include" -I"$PS3/libs/system" -I"$PS3/libs/filesystem" \
            -I"$PS3/libs/input" -I"$PS3/libs/audio" -I"$PS3/libs/video" \
            -I"$PS3/libs/network" -I"$PS3/libs/spurs" -I"$PS3/libs/sync" \
            -I"$PS3/libs/codec" -I"$PS3/libs/font" -I"$PS3/libs/misc" \
            -I"$PS3/runtime" -I"$PS3/runtime/platform" -I"$PS3/runtime/spu" \
            -I"$PS3/third_party/mbedtls/include" \
            "$PS3/runtime/platform/win32_compat.c"
      - name: Check PPU boot host iOS compatibility
        run: bash ios/scripts/check-ppu-host-ios-compat.sh "$RUNNER_TEMP/ps3recomp"
      - name: Build PPU host scaffold archive for iOS
        run: bash ios/scripts/build-ppu-host-ios.sh "$RUNNER_TEMP/ps3recomp" ios/build/ppu-host-ios
      - name: Test ARM64 PPU lift archive builder
        run: bash ios/scripts/run-ppu-lift-ios-smoke-test.sh "$RUNNER_TEMP/ps3recomp"
      - name: Test private title-lift pipeline preflight
        run: bash ios/scripts/run-title-lift-preflight-smoke-test.sh
      - name: Build optional title PPU/SPU lift archive for iOS
        run: |
          bash ios/scripts/build-ppu-lift-ios.sh "$RUNNER_TEMP/ps3recomp" \
            ios/GameLift/recompiled ios/GameLift/spu ios/build/ppu-lift-ios
      - name: Install XcodeGen and CMake tools
        run: brew install xcodegen cmake ninja
      - name: Build patched ps3recomp runtime for iOS
        run: |
          PS3="$RUNNER_TEMP/ps3recomp"
          BUILD="$RUNNER_TEMP/ps3recomp-ios-build"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S "$PS3" -B "$BUILD" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER="$(xcrun -f clang)" \
            -DCMAKE_CXX_COMPILER="$(xcrun -f clang++)" \
            -DCMAKE_OBJC_COMPILER="$(xcrun -f clang)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS3RECOMP_BUILD_TESTS=OFF \
            -DPS3RECOMP_RSX_HAL=OFF \
            -DPS3RECOMP_FFMPEG_RUNTIME=OFF
          cmake --build "$BUILD" --target ps3recomp_runtime --parallel 2
          RUNTIME_LIB="$(find "$BUILD" -name 'libps3recomp_runtime.a' -type f -size +0c -print -quit)"
          test -n "$RUNTIME_LIB"
          mkdir -p ios/build/ps3recomp-runtime/include/ps3emu
          cp "$RUNTIME_LIB" ios/build/ps3recomp-runtime/
          cp "$PS3/libs/video/rsx_metal_backend.h" ios/build/ps3recomp-runtime/include/
          cp -R "$PS3/include/ps3emu/." ios/build/ps3recomp-runtime/include/ps3emu/
          test -s ios/build/ps3recomp-runtime/include/rsx_metal_backend.h
          test -s ios/build/ps3recomp-runtime/include/ps3emu/ps3types.h
      - name: Run ISO reader smoke test
        run: bash ios/scripts/run-iso-smoke-test.sh
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned iOS app
        working-directory: ios
        run: >-
          xcodebuild
          -project SoulbrandtIOS.xcodeproj
          -scheme SoulbrandtIOS
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -configuration Debug
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/Soulbrandt.app build/Payload/
          cp ThirdParty/libudfread/COPYING build/Payload/Soulbrandt.app/COPYING
          test -s build/Payload/Soulbrandt.app/COPYING
          cd build
          /usr/bin/zip -qry Soulbrandt-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Soulbrandt-PS3Recomp-iOS-runtime
          path: ios/build/ps3recomp-runtime/libps3recomp_runtime.a
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Soulbrandt-PPU-host-ios
          path: ios/build/ppu-host-ios/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Soulbrandt-unsigned-IPA
          path: ios/build/Soulbrandt-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
